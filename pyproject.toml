[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crotalus"
dynamic = ["version"]
description = "Real-time supply-chain monitoring for PyPI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Zaan Saeed", email = "zaan.saeed3406@gmail.com"}]
keywords = ["security", "supply-chain", "pypi", "malware-detection"]


dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/zaansaeed/crotalus"
Repository = "https://github.com/zaansaeed/crotalus"

[tool.hatch.version]
path = "src/crotalus/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "feedparser" #has no default type checking
ignore_missing_imports = true 